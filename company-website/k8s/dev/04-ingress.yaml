apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prasanth-dev-ingress
  namespace: prasanth-dev
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: dev.prasanthassociates.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000
