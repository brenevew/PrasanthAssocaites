apiVersion: v1
kind: Secret
metadata:
  name: frontend-prod-secret
  namespace: prasanth-prod
type: Opaque
stringData:
  # Deployed Google Apps Script web app URL (ends in /exec).
  GOOGLE_SHEETS_WEBHOOK_URL: "CHANGE_ME_https://script.google.com/macros/s/DEPLOYMENT_ID/exec"
  # Must match the SHARED_SECRET script property in the Apps Script project.
  GOOGLE_SHEETS_SHARED_SECRET: "CHANGE_ME_LONG_RANDOM_TOKEN"
  # Stable across every replica, or Server Action payloads fail after a scale-out.
  # Generate with: openssl rand -base64 32
  NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: "CHANGE_ME_BASE64_32_BYTE_KEY"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-prod-config
  namespace: prasanth-prod
data:
  NODE_ENV: "production"
  NEXT_PUBLIC_APP_ENV: "production"
  NEXT_PUBLIC_SITE_URL: "https://prasanthassociates.com"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-prod
  namespace: prasanth-prod
  labels:
    app: frontend
    environment: prod
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: frontend
      environment: prod
  template:
    metadata:
      labels:
        app: frontend
        environment: prod
    spec:
      containers:
        - name: frontend
          image: ghcr.io/prasanthassociates/frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: frontend-prod-config
            - secretRef:
                name: frontend-prod-secret
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: prasanth-prod
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: frontend
    environment: prod
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-hpa
  namespace: prasanth-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend-prod
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
